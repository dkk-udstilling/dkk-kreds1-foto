<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografering af hunde | DKK Kreds 1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- EXACT DKK HEADER REPLICA -->
    <header class="dkk-header">
        <div class="header-container">
            <div class="header-top-row">
                <div class="menu-left">
                    <div class="hamburger">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="menu-text" data-i18n="menu">MENU</span>
                </div>
                <div class="top-right-icons">
                    <a href="https://www.dkk.dk" target="_blank"><i class="fa-solid fa-lock"></i> <span data-i18n="login">Login</span></a>
                    <a href="https://www.hundeweb.dk" target="_blank"><i class="fa-solid fa-paw"></i> Hundeweb</a>
                    <a href="#" id="langSwitchBtn" onclick="toggleLanguage(event)"><i class="fa-solid fa-globe"></i> <span id="langLabel">English</span></a>
                    <a href="https://www.dkk.dk/shop" target="_blank"><i class="fa-solid fa-basket-shopping"></i> Shop</a>
                    <a href="https://www.dkk.dk" target="_blank"><i class="fa-solid fa-magnifying-glass"></i></a>
                </div>
            </div>
            
            <div class="header-main-nav">
                <nav class="nav-left">
                    <a href="https://www.dkk.dk/hundeejer" data-i18n="nav_owner">Hundeejer</a>
                    <a href="https://www.dkk.dk/opdraetter" data-i18n="nav_breeder">Opdrætter</a>
                    <a href="https://www.dkk.dk/aktiviteter" data-i18n="nav_activities">Aktiviteter</a>
                    <a href="https://www.dkk.dk/uddannelser" data-i18n="nav_education">Uddannelser</a>
                </nav>
                
                <div class="logo-center" onclick="window.location.href='https://www.dkk.dk'">
                    <i class="fa-solid fa-dog"></i>
                    <span>DANSK KENNEL KLUB</span>
                </div>

                <nav class="nav-right">
                    <a href="https://www.dkk.dk/hundeudstilling" data-i18n="nav_shows">Udstillinger</a>
                    <a href="https://www.dkk.dk/om-dkk" data-i18n="nav_about">Om DKK</a>
                    <a href="https://www.dkk.dk/bliv-medlem" data-i18n="nav_member">Bliv medlem</a>
                    <a href="https://www.dkk.dk/kontakt" data-i18n="nav_contact">Kontakt</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero-section fade-in">
        <h1 data-i18n="hero_title">Ansøgning: Fotografering af hunde</h1>
        <p data-i18n="hero_subtitle">Udfyld formularen for at din hund kan indgå i kampagnematerialet for DKK Kreds 1.</p>
    </section>

    <!-- FORM SECTION -->
    <main class="form-wrapper fade-in delay-1">
        <form id="dkkForm" autocomplete="off">
            
            <div class="form-section">
                <h2 data-i18n="owner_title">Ejerinformation</h2>
                
                <div class="input-group">
                    <input type="text" id="ownerName" required placeholder=" ">
                    <label for="ownerName" data-i18n="f_name">Fulde navn (Dansk format)</label>
                    <i class="fa-solid fa-check validation-icon"></i>
                </div>

                <div class="input-group">
                    <input type="text" id="ownerAddress" required placeholder=" ">
                    <label for="ownerAddress" data-i18n="f_address">Fulde Adresse</label>
                    <i class="fa-solid fa-check validation-icon"></i>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <input type="email" id="ownerEmail" required placeholder=" ">
                        <label for="ownerEmail" data-i18n="f_email">E-mailadresse</label>
                        <i class="fa-solid fa-check validation-icon"></i>
                    </div>
                    <div class="input-group">
                        <input type="tel" id="ownerPhone" required placeholder=" ">
                        <label for="ownerPhone" data-i18n="f_phone">Telefonnummer</label>
                        <i class="fa-solid fa-check validation-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="ownerSocials" placeholder=" ">
                    <label for="ownerSocials" data-i18n="f_socials">Links til Sociale Medier (f.eks. Instagram)</label>
                </div>

                <div class="input-group">
                    <input type="text" id="dkkMember" placeholder=" ">
                    <label for="dkkMember" data-i18n="f_dkk">DKK Medlemsnummer (Valgfrit)</label>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <h2 data-i18n="dog_title">Hundeinformation</h2>
                </div>
                
                <div id="dogsContainer">
                    <!-- Dogs injected by JS -->
                </div>

                <button type="button" class="btn-secondary" id="addDogBtn">
                    <i class="fa-solid fa-plus"></i> <span data-i18n="btn_add_dog">Tilføj endnu en hund</span>
                </button>
            </div>

            <div class="submit-area">
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span data-i18n="btn_submit">Send Ansøgning</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
                <div id="statusMessage" class="status-message"></div>
            </div>
        </form>
    </main>

    <!-- SPONSORS REPLICA -->
    <section class="sponsors fade-in delay-2">
        <img src="https://www.dkk.dk/assets/images/dkk-logo-red.svg" alt="DKK Seal" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Red_circle.svg/100px-Red_circle.svg.png';">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/53/FCI_logo.svg/150px-FCI_logo.svg.png" alt="FCI">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Agria_Djurf%C3%B6rs%C3%A4kring_logo.svg/200px-Agria_Djurf%C3%B6rs%C3%A4kring_logo.svg.png" alt="Agria">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Royal_Canin_logo.svg/200px-Royal_Canin_logo.svg.png" alt="Royal Canin">
    </section>

    <script src="script.js"></script>
</body>
</html>
