<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Omstiller...</title>
</head>
<body style="background-color: #f7f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    
    <div style="text-align: center; color: #374151;">
        <svg style="animation: spin 1s linear infinite; height: 40px; width: 40px; color: #de0b25; margin: 0 auto 15px auto;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <p>Åbner sikker formular...</p>
    </div>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>

    <script>
        const NTFY_TOPIC = "dkkkreds1_fotoshoot_secret_98765"; 
        
        const urlParams = new URLSearchParams(window.location.search);
        let userNameRaw = urlParams.get('user') || "En ukendt modtager";
        let userNameClean = userNameRaw.replace(/_/g, ' ');

        async function trackAndRedirect() {
            try {
                // Send besked til ntfy (Uden IP, så det går meget hurtigere)
                await fetch(`https://ntfy.sh/`, {
                    method: 'POST',
                    body: JSON.stringify({
                        topic: NTFY_TOPIC,
                        title: `🖱️ Link Klikket!`,
                        message: `${userNameClean} har netop klikket på linket i e-mailen og er på vej til formularen!`,
                        tags: ['mouse', 'bell']
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (err) {
                console.error(err);
            } finally {
                // Sender modtageren videre til selve DKK formularen
                // Vi tilføjer ?user= igen, så din index.html også ved hvem det er
                window.location.href = `index.html?user=${userNameRaw}`;
            }
        }

        trackAndRedirect();
    </script>
</body>
</html>
